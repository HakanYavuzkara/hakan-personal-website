<body>

  <!-- "Main" app -->
<a class="main-app" href="/">
    <span class="main-app-icon"></span>
    <span class="main-app-label">Main</span>
  </a>

  <!-- Desktop with 3 folders -->
  <main class="desktop">
    <button class="folder" onclick="openFolder('about', this)">
      <span class="folder-icon"></span>
      <span class="folder-label">About</span>
    </button>
    <button class="folder" onclick="openFolder('projects', this)">
      <span class="folder-icon"></span>

    </button>
    <button class="folder" onclick="openFolder('concerts', this)">
      <span class="folder-icon"></span>

    </button>

  <div class="window" id="folderWindow">
    <div class="window-bar">

  <script>
    const win = document.getElementById('folderWindow');
    const title = document.getElementById('windowTitle');
    const body = document.getElementById('windowBody');
    const backBtn = document.getElementById('windowBack');

    /* Tree of contents */
    const tree = {
      about: {
        type: 'folder', name: 'About',
        children: [
          { type: 'file', name: 'Who.txt', text: 'I am Hakan. I love physics, computers, music, films, bullet chess, fantasy basketball, and conference food. I plan to become a physics researcher/professor.' },
          { type: 'file', name: 'JudgeMyTaste.txt',  text: '<a href="https://letterboxd.com/HakanBeWatchin/" target="_blank">Letterboxd</a><br><a href="https://rateyourmusic.com/~HakanBeListenin" target="_blank">RateYourMusic</a><br>Feel free to send recommendations or your disapproval through <a href="mailto:hayavuzkara@davidson.edu">hayavuzkara@davidson.edu</a>' },
          { type: 'file', name: 'Credits.txt', text: 'All pixel art by me using LibreSprite. All ideas, design, and writings by me. 95% of HTML/CSS/JavaScript code by Claude Opus 5. Find this project on <a href="https://github.com/HakanYavuzkara/hakan-personal-website" target="_blank">GitHub</a>.' },

        ]
      },
      projects: {
        type: 'folder', name: 'Projects',
        children: [
          { type: 'file', name: 'FantasyBball.txt', text: 'I answered the question of who would be the most valuable players across eras if 9-cat Fantasy Basketball existed every season after the 3-point line was added. I took into account z-scores for all 9 categories for every player in each season to determine the most valuable 9-cat players with respect to the seasons they played in. Coded strictly in Mathematica. Can be found <a href="https://community.wolfram.com/t/nba-player-ranking-in-fantasy-basketball-9-cat-mode-mean-category-scores-and-z-score/25387" target="_blank">here</a>.<br>I should fix the ft% and fg% evaluation soon to take into account the volume since I forgot to do it the first time. Current estimate has the greatest fantasy basketball season by a player using total z-score across all statistical categories as 2019 James Harden, which is not surprising to me.' },
          { type: 'file', name: 'ChessEras.txt', text: 'I tried to find the most dominant runs in chess by using the Chess.com database to find highest W/D/L scores for early-modern eras of chess. This project was not as successful as I wanted it to be due to lack of an elo-based system causing heavy noise. While a 6W/6D record against super GMs demonstrates significant dominance, a player who went 9W/1D against IMs in the same year gets a higher score. The elo based calculation requires significantly more expensive computation, and my computer could not handle years past 1945 when the number of games each year increased significantly. Feel free to borrow from my project <a href="https://community.wolfram.com/t/chess-scorelines-w-d-l-of-top-players-during-the-early-modern-eras-1851-1945/25500" target="_blank">here</a> and do these yourself :). Coded strictly in Mathematica. If I decide to do this again, I will probably code it in Julia, since it should offer better data optimization and faster numerical computations for such task.' },
          { type: 'file', name: 'HSfilms.txt', text: 'A few films I did in high school, in order of how much I like them:<br><a href="https://www.youtube.com/watch?v=rSAwmJ9Iphs" target="_blank">Quick Draw Samurai</a><br><a href="https://www.youtube.com/watch?v=5WTVq00L60w" target="_blank">Punica Granatum</a><br><a href="https://www.youtube.com/watch?v=TujKXYURNSA" target="_blank">A Quick Game</a>' }
        ]
      },
      concerts: {
        type: 'folder', name: 'Concert_Blogs',
        children: [
          {
            type: 'folder', name: 'Ghais Guevara',
            children: [
              { type: 'file', name: 'GGblog.txt', text: 'Charlotte: July 30, 2026<br>I had a really nice time at this concert being able to speak with Ghais since he was there an hour before the start time (very rare for artits!). I particularly enjoyed Cavalier\'s opening act, and how engaged he was with the audience. While Ghais\'s energy was great and he did not miss a bar the entire show, the crowd was not as energetic that is partially due to Ghais deciding to stick to his later catalog rather than his two most popular albums. Still, I had a great time and small venues are often more fun.' },
              { type: 'image', name: 'GGphoto.jpg', src: 'graphics_personal/concerts/GGphoto.JPG' },
            ]
          },
          {
            type: 'folder', name: 'Machine Girl',
            children: [
              { type: 'file', name: 'MGblog.txt', text: 'Charlotte: March 6, 2026<br>Definitely top 3 concert I have been to. I knew and actively listened to both opening acts of LustSickPuppy and Show Me The Body, so I had an excellent time far before Machine Girl took stage. After they took stage, their energy, crowd engagement, tracklist choices and pacing were all excellent. Machine Girl decided to stick with their more Digital Hardcore style later discography rather than the Hardcore Breaks electronic music style they have been known for, which really helped the vocals shine and crowd energy flow.' },
              { type: 'image', name: 'MGphoto1.jpg', src: 'graphics_personal/concerts/MGphoto1.jpg' },
              { type: 'image', name: 'MGphoto2.jpg', src: 'graphics_personal/concerts/MGphoto2.jpg' },
            ]
          },
          {
            type: 'folder', name: 'black midi',
            children: [
              { type: 'file', name: 'BMblog.txt', text: 'Istanbul: May 31, 2022<br>This concert happened far before this blog became a thing, but still many years later it is the main inspiration for me to start this blog in order to not forget about the concerts I have been to. black midi was the best modern rock band despite its really short existence, and all of the band members solo careers are all worth checking out. This concert showed me that a collection of creative musicians, when on the same wavelength all of the time, and brave enough to experiment even live can create something so special and unique. black midi never played their songs the way they are on streaming, and always messed with the style of singing, tempo throughout the song, very jazzy improvisation sections, and even sneaking in Britney Spear\'s famous Toxic guitar riff seamlessly in a song in the midde of a breakdown. I am so grateful I got to see black midi before their breakup. I completely forgot to took any pictures during this concert.' },
            ]
          },
          {
            type: 'folder', name: 'Boris',
            children: [
              { type: 'file', name: 'Borisblog.txt', text: 'London: October 15, 2026<br>I have known about Boris for around 7 years, but it took me much longer for them to grow on me, and eventually become one of my favorite artists of all time. I used to not find Boris unique and exciting enough, limiting their music to one-take live recordings with a maximum of 3-4 instruments per song. Listening more carefully through what is achieved by Pink, Feedbacker, flood, and Akuma No Uta has completely changed my opinion on this matter. Boris is extremely unique in its ability to blend sludge metal, drone, ambient, noise rock, and acoustic rock like done by no one else and even shifting genres and styles in the middle of songs. It is amazing how rich and diverse just 3 people on stage with live instruments is able to sound. <br> The opener for this concert was Planning for Burial, an artist I had heard of but never gave a listen to before. This performance showed me a lot of potential but not much output. As a one-person band, Planning for Burial is forced to do a lot on stage, playing a repeating drum machine with droning bass, and playing guitar and providing vocals himself. Unfortunately, how hard such a set up is forces him to keep the droning sections way longer than they should be and the drums pretty boring and often out of place with everything else. Still, there were a lot of really strong moments with piercing guitar playing and great vocals provided. I am sure this artist is better on streaming, so I will check him out. <br>Boris was almost able to rupture through my ear protection. I was able to enjoy this as a loud concert rather than a deafening one due to strong ear protection. Boris’s stage presence and general crowd engagement was done really well, and their clothes also stood out nicely and looked great under the lightning. Boris essentially never stopped playing, and always kept drones and some gong hits through the breaks, transitioning into next songs very smoothly. The balance of high energy and more slow burn doom metal post rock-like songs were sprinkled in between the Pink tracklist just in time as the mosh was getting tired throughout. Just Abandoned Myself is one of my favorite songs ever, and seeing it live, with extra improvisations and the crowd singing parts throughout. Concert felt like it went by very fast despite Boris playing an amazing 90 minutes. I want to see Feedbacker live sometime, although it is likely it will never happen. <br> P.S. Nicest mosh I have been a part of' },
              { type: 'image', name: 'Borisphoto1.jpg', src: 'graphics_personal/concerts/Borisphoto1.jpg' },
              { type: 'image', name: 'Borisphoto2.jpg', src: 'graphics_personal/concerts/Borisphoto2.jpg' },
              { type: 'image', name: 'Borisphoto1.jpg', src: 'graphics_personal/concerts/Borisphoto1.jpg' },
            ]
          },
          {
            type: 'folder', name: 'Psychedelic Crumpets',
            children: [
              { type: 'file', name: 'PPCblog.txt', text: 'Oxford: November 4, 2026<br>I discovered PPC just about a month ago when a friend at Oxford recommended them to me, and told me that they are playing in Oxford soon. I became a fan after listening to their first two albums, and got tickets for the concert as well. I would describe their music as Tame Impala, but either at twice the speed with aggresive drums, or half the speed with minimal drums, which was a great variety to have in a concert.<br>The opening act for PPC was a small band I had never heard of called "Flat Moon", and they were some of the most fun I had in a concert ever. Their line-up including the usual 2 guitarists, a bassist, and a drummer, but also a keyboard/percussionist as well as a saxophone had me interested from the start. When they started playing, they were extremely unpredictable and fun with well-made tempo changes mid-songs, weird time signatures that left head-banging off-beat each bar. They were really funny in-between songs, and the bassists antics with essentially jump-kicking the air on songs was really entertaining. They also had a few moments where they tried to create a wave on stage by jumping, and struggled to do so. Their first song was amazing, and I would describe their style to be a mix of punk and funk. I am a fan, and have listened to both of their albums since.<br>PPC had a line-up of two guitarists, two bassists, and a drummer for a well-paced performance of really energetic and more chill songs. I was unsure at first if a mosh was ever going to form at this concert prior, but with them playing their best song "Found God in a Tomato" second, the pit formed immediately, and was among the biggest ones I have seen. Their formula for the concert was often two energetic songs in a row, and then a more chill one for people to relax but even at the most chill songs there was a lot of movement going on in the pit. The venue was great, and I found myself at the very front a few times. They also had a really funny moment, when someone in the crowd suggested they play "Bowling with Tim", and other people joined in for such a niche song. They said they need to relearn the song, then tried on stage to remember for a few minutes, eventually deciding that they will not give out a terrible performance for the song. This was a really fun concert, and I am glad I went.' },
              { type: 'image', name: 'FlatMoonphoto.jpg', src: 'graphics_personal/concerts/FlatMoonphoto.jpg' },
              { type: 'image', name: 'PPCphoto2.jpg', src: 'graphics_personal/concerts/PPCphoto2.jpg' },
              { type: 'image', name: 'PPCphoto1.jpg', src: 'graphics_personal/concerts/PPCphoto1.jpg' },
            ]
          },
          {
            type: 'folder', name: 'The Avalanches',
            children: [
              { type: 'file', name: 'Avalanchesblog.txt', text: 'London: November 6, 2026<br>"Since I left you" is one of my favorite albums of all time, and I have wanted to see them live for a really long time despite knowing that I enjoy live instrumentation much more in live performances. Still, I think of Avalances as one of the most creative musicians of all time, and expected them making their live performances unique, and that was for no reason. I had not yet listened to their newest album "No Bad Memories" at this point by my entire mistake, which was what the tour was for, but I am still really glad I went.<br>I missed the opening act I was more excited for in Panda Bear since it took me a while to get to the venue from Oxford, but had a chance to watch Sonic Boom. Sonic Boom provided live vocals and DJ instrumentations. Despite having good songs here and there, I found most of the performance to be lacking in variety with primarily stagnant songs that sounded like they would be more suitable for the soundtrack of Lion King. There was also a glaring issue with how the vocals were mixed into the audio. Still, I found the vocals despite the mixing issue to be enjoyable, and enjoyed some of the songs, and their visuals were awesome.<br>The Avalanches came in with tons of energy to the stage, jumping around, which also got me even more excited. While I was still surpries with some of the sound mixing issues for such a highly regarded performance in a highly regarded venue, but I will look past that issue. The Avalanches had a much less moving and older crowd than what I am used to, but people were still really enjoying the performance and smiling throughout. Their DJing on their own songs was really well made, and almost the entire performance was one continous one with no breaks, with some of my favorite songs of all time played with the crowd singing alone to samples they have used (never saw this before). They also had some stunning visuals in the background throughout that had me staring at them for a while in awe. Their closer to their performance being "Since I Left You", their first, and also best song, was quite poetic and emotional to do so. They came back for the encore for a few more songs off their new album, but I will consider "Since I Left You" to be the true ending. I enjoyed it a lot, thought a lot about life, and saw one of my most played artists live!! ' },
              { type: 'image', name: 'Avalanchesphoto1.jpg', src: 'graphics_personal/concerts/Avalanchesphoto1.jpg' },
              { type: 'image', name: 'Avalanchesphoto2.jpg', src: 'graphics_personal/concerts/Avalanchesphoto2.jpg' },
            ]
          },

        ]
      }
    };

    let path = [];

    /* given the current path, walk the tree to find the folder we're in */
    function getCurrentFolder() {
      let node = tree[path[0]];
      for (let i = 1; i < path.length; i++) {
        const next = node.children[path[i]];
        if (!next || next.type !== 'folder') break; // stop at a file and stay in its folder
        node = next;
      }
      return node;
    }
    /* build a breadcrumb path from the current location */
    function buildPath() {
      const parts = [];
      let node = tree[path[0]];
      parts.push(node.name); // top-level folder name

      for (let i = 1; i < path.length; i++) {
        const step = path[i];
        if (step === '__file__') break;
        node = node.children[step];
        parts.push(node.name);
      }
      return parts.join(' / ');
    }

    /* open desktop folder */
    function openFolder(key, clickedEl) {
      document.querySelectorAll('.folder').forEach(f => f.classList.remove('selected'));
      if (clickedEl) clickedEl.classList.add('selected');
      path = [key];
      render();
      win.classList.add('is-open');
    }

    /* draw current folder's contents into window */
    function render() {
      const folder = getCurrentFolder();
      title.textContent = buildPath();
      backBtn.style.visibility = (path.length > 1) ? 'visible' : 'hidden';
      body.innerHTML = '';

      const grid = document.createElement('div');
      grid.className = 'items';

      folder.children.forEach((item, index) => {
        const tile = document.createElement('button');
        tile.className = 'item ' + item.type;

        const icon = document.createElement('span');
        icon.className = 'item-icon';

        const label = document.createElement('span');
        label.className = 'item-label';
        label.textContent = item.name;

        tile.appendChild(icon);
        tile.appendChild(label);

        tile.onclick = () => {
          // highlight this tile, clear others
          grid.querySelectorAll('.item').forEach(t => t.classList.remove('selected'));
          tile.classList.add('selected');
          openItem(index);
        };

        grid.appendChild(tile);
      });

      body.appendChild(grid);
    }

    /* When clicking file */
    function openItem(index) {
      const item = getCurrentFolder().children[index];
      if (item.type === 'folder') {
        path.push(index);    // go one level deeper
        render();
      } else if (item.type === 'image') {
        showImage(item);
      } else {
        showFile(item);
      }
    }

    function showFile(file) {
      backBtn.style.visibility = 'visible';
      body.innerHTML = '<div class="file-text"></div>';
      body.querySelector('.file-text').innerHTML = file.text;
      path.push(getCurrentFolder().children.indexOf(file));
      title.textContent = buildPath();
    }

    function showImage(image) {
      backBtn.style.visibility = 'visible';
      body.innerHTML = '<img class="image-view" alt="">';
      const img = body.querySelector('.image-view');
      img.src = image.src;
      img.alt = image.name;
      path.push(getCurrentFolder().children.indexOf(image));
      title.textContent = buildPath();
    }

    function goBack() {
      path.pop();
      render();
    }

    function closeWindow() {
      win.classList.remove('is-open');
      path = [];
      document.querySelectorAll('.folder').forEach(f => f.classList.remove('selected'));
    }
  </script>


<script>
  // PARTICLE ANIMATION =====
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');

  function sizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  // Parameters for the oval path (need to change for mobile)
  const oval = {
    centerX: 0.50,
    centerY: 0.529,
    radiusX: 0.328,
    radiusY: 0.350
  };

  let angle = 0;

  // Start slow and accelerate =====
  let speed = 0.004;
  const maxSpeed = 0.1;
  const acceleration = 0.00004;

  const trail = [];
  const maxTrail = 25;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = oval.centerX * canvas.width;
    const cy = oval.centerY * canvas.height;
    const rx = oval.radiusX * canvas.width;
    const ry = oval.radiusY * canvas.height;

    const x = cx + Math.cos(angle) * rx;
    const y = cy + Math.sin(angle) * ry;

    const floorGlowRadius = 130;
    const floorGlow = ctx.createRadialGradient(x, y, 0, x, y, floorGlowRadius);
    floorGlow.addColorStop(0, 'rgba(255, 120, 60, 0.22)');   // faint warm center
    floorGlow.addColorStop(0.5, 'rgba(255, 106, 61, 0.08)');   // fading
    floorGlow.addColorStop(1, 'rgba(255, 106, 61, 0)');      // transparent edge
    ctx.beginPath();
    ctx.arc(x, y, floorGlowRadius, 0, Math.PI * 2);
    ctx.fillStyle = floorGlow;
    ctx.fill();

    trail.unshift({ x, y });
    if (trail.length > maxTrail) trail.pop();

    // draw the trail: each older point smaller and more transparent
    for (let i = 0; i < trail.length; i++) {
      const p = trail[i];
      const fade = 1 - i / trail.length;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4 * fade, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 106, 61, ' + (fade * 0.5) + ')';
      ctx.fill();
    }

    // the glowing particle head
    const glowRadius = 40;
    const glow = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
    glow.addColorStop(0, 'rgba(255, 120, 70, 0.9)');
    glow.addColorStop(0.4, 'rgba(255, 106, 61, 0.4)');
    glow.addColorStop(1, 'rgba(255, 106, 61, 0)');
    ctx.beginPath();
    ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#ff6a3d';
    ctx.fill();

    angle += speed;
    if (speed < maxSpeed) {
      speed += acceleration;
      if (speed > maxSpeed) speed = maxSpeed;
    }

    requestAnimationFrame(draw);
  }

  draw();

function reveal() { document.body.classList.add('ready'); }
window.addEventListener('load', reveal);
setTimeout(reveal, 3000);
</script>
