<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.add('js');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hakan Bora Yavuzkara</title>
  <link rel="canonical" href="https://hakanbora.com/">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="hidden">Hakan Bora Yavuzkara</h1>
  <div class="stage">
    <div class="bg"></div>
    <a class="btn-personal" href="/personal/" aria-label="Personal"></a>
    <a class="btn-prof" href="/professional/" aria-label="Professional"></a>
  </div>

  <script>
    const stage = document.querySelector('.stage');
    const ART_W = 320;
    const ART_H = 180;

    function fitStage() {
      const scale = Math.min(window.innerWidth / ART_W, window.innerHeight / ART_H);
      const left = (window.innerWidth - ART_W * scale) / 2;
      const top = (window.innerHeight - ART_H * scale) / 2;
      stage.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
    }

    window.addEventListener('resize', fitStage);
    fitStage();

    function reveal() { document.body.classList.add('ready'); }
    window.addEventListener('load', reveal);
    setTimeout(reveal, 3000);
  </script>

</body>
</html>
