<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hakan Bora Yavuzkara</title>
  <link rel="stylesheet" href="style.css">
</head>

<script>
  function scaleStage() {
    const stage = document.querySelector('.stage');
    const scale = Math.min(
      window.innerWidth  / 320,   // ← your art width
      window.innerHeight / 180    // ← your art height
    );
    stage.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', scaleStage);
  scaleStage();
</script>

<body>
  <div class="stage">
    <div class="bg"></div>
    <a class="btn-personal" href="personal/index.html" aria-label="Personal"></a>
    <a class="btn-prof" href="professional/index.html" aria-label="Professional"></a>
  </div>
</body>
</html>
